[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlorch"
version = "0.1.0"
description = "An ML pipeline orchestrator with a from-scratch DAG scheduler, content-addressed dataset versioning, an online/offline feature store, a model registry, drift detection, incremental backfill, and pluggable executors (local/docker/k8s)."
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
