[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digitaltwin"
version = "0.1.0"
description = "An agent-based / discrete-event simulation engine applied to urban logistics: physics, automatic parameter calibration, a scenario API, and 3D visualization data export."
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
